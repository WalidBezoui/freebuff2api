services:
  - type: web
    name: freebuff2api
    env: node
    region: oregon # US West (Oregon) - Free US Egress
    plan: free
    buildCommand: ""
    startCommand: "node server.js"
    envVars:
      - key: FREEBUFF_API_KEY
        sync: false # 必填：在 Render Dashboard 设置；无默认密钥（fail-closed）
      - key: FREEBUFF_TOKEN
        sync: false # Set in Render Dashboard
